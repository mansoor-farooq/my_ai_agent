name: Bug report
description: Report a reproducible problem in Ultra Agent
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ultra Agent version
      placeholder: "1.19.2"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Include safe commands and results. Do not include secrets or private project files.
    validations:
      required: true
