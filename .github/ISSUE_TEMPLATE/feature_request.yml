name: Feature request
description: Propose a focused improvement for Ultra Agent
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include scope, acceptance criteria and evidence you expect.
    validations:
      required: true
